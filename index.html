<!doctype html>
<html lang="en" data-theme="anime" data-motion="on">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GitHub profile</title>
  <link rel="stylesheet" href="/src/style.css">
</head>
<body>
  <a class="skip" href="#repos">Skip to repositories</a>
  <div id="sky" aria-hidden="true"></div>
  <main>
    <header id="header" class="hero" aria-busy="true"><p class="hero-inner">Loading profile…</p></header>
    <section aria-labelledby="stats-h">
      <h2 id="stats-h">Numbers</h2>
      <div id="stats"></div>
    </section>
    <section id="repos" aria-labelledby="repos-h">
      <h2 id="repos-h">Repositories</h2>
      <div id="filter" role="toolbar" aria-label="Filter repositories by language"></div>
      <ul id="repo-list" class="repos"></ul>
    </section>
    <div id="status" class="sr" role="status" aria-live="polite"></div>
  </main>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
